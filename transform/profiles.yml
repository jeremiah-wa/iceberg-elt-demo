transform:
  target: dev
  outputs:
    dev:
      # Trino (infra/docker-compose.yml, reached by service name from the dagster container)
      # runs the models. Its catalog `lake` is the Lakekeeper warehouse "demo", configured in
      # infra/trino/catalog/lake.properties
      type: trino
      method: none
      host: trino
      port: 8080
      user: dbt
      database: lake
      # Models set their own schema (staging, marts). This is only the fallback
      schema: main
    # For `dbt docs generate` in CI (.github/workflows/dbt-docs.yml), where Trino isn't
    # running. The workflow passes --empty-catalog and --no-populate-cache, so dbt never
    # connects. Models compile, but the catalog has no columns
    docs:
      type: trino
      method: none
      host: localhost
      port: 8080
      user: dbt
      database: lake
      schema: main
