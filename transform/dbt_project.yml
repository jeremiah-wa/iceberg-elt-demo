name: transform

profile: transform

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"

models:
  transform:
    # Every model is an Iceberg table in the REST catalog attached as `lake` (see profiles.yml).
    # The built-in `table` materialization needs the overrides in macros/iceberg_relations.sql
    +database: lake
    +materialized: table
    staging:
      +schema: staging
    marts:
      +schema: marts
