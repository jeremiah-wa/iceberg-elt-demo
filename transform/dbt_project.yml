name: transform

profile: transform

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"

flags:
  # Opts into dbt-trino's future default, which silences a warning on every run. Trino is
  # reached over plain http (profiles.yml), so there's no certificate to validate
  require_certificate_validation: true

models:
  transform:
    # Every model is an Iceberg table in Trino's catalog `lake` (see profiles.yml). `replace`
    # rebuilds a table with CREATE OR REPLACE TABLE, which swaps it in one Iceberg commit
    +database: lake
    +materialized: table
    +on_table_exists: replace
    staging:
      +schema: staging
    marts:
      +schema: marts
