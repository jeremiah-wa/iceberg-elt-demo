name: transform

profile: transform

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"

models:
  transform:
    # Every model is an Iceberg table in the REST catalog attached as `lake` (see profiles.yml)
    +database: lake
    +materialized: iceberg_table
    staging:
      +schema: staging
    marts:
      +schema: marts
