[project]
name = "iceberg-elt-demo"
version = "0.1.0"
description = "Vendor-agnostic ELT demo: dlt -> Apache Iceberg -> dbt, orchestrated by Dagster"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["extract-load", "transform", "orchestrate"]

[tool.uv]
package = false

[tool.uv.sources]
extract-load = { workspace = true }
transform = { workspace = true }
orchestrate = { workspace = true }

[tool.uv.workspace]
members = ["extract_load", "transform", "orchestrate"]
