[project]
name = "extract-load"
version = "0.1.0"
description = "dlt pipeline: GitHub API -> Iceberg (raw)"
requires-python = ">=3.13"
dependencies = [
    "dlt[filesystem,pyiceberg]>=1.30.0",
]

# Installed (editable) so orchestrate/ can import `github_pipeline` and the `github` source
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["github", "github_pipeline.py"]
