[runtime]
log_level="WARNING"  # the system log level of dlt
# use the dlthub_telemetry setting to enable/disable anonymous usage data reporting, see https://dlthub.com/docs/reference/telemetry
dlthub_telemetry = true

# Runs inside the dagster container (infra/docker-compose.yml), which reaches MinIO and
# Lakekeeper by service name and passes the MinIO keys as environment variables.
[destination.filesystem]
bucket_url = "s3://lake/lakekeeper"  # must sit inside the Lakekeeper warehouse location

[destination.filesystem.credentials]
endpoint_url = "http://minio:9000"
region_name = "us-east-1"

# Lakekeeper REST catalog. It vends short-lived S3 credentials (STS) per table, so no keys here.
[iceberg_catalog]
iceberg_catalog_type = "rest"

[iceberg_catalog.iceberg_catalog_config]
type = "rest"
uri = "http://lakekeeper:8181/catalog"
warehouse = "demo"
