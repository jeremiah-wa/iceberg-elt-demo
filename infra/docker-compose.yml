# Local Iceberg lakehouse: MinIO (S3-compatible storage), Lakekeeper (Iceberg REST catalog),
# Trino, which runs dbt's SQL, and Dagster, which runs the dlt -> dbt pipeline.
#
#   Dagster    -> http://localhost:3000   UI: "Materialize all" runs the pipeline
#   MinIO      -> http://localhost:9001   console (API on :9000)
#   Lakekeeper -> http://localhost:8181   UI + Iceberg REST catalog (warehouse "demo")
#   Trino      -> http://localhost:8080   UI: queries dbt sent
#
# Every service except lakekeeper-db shares the network namespace of the `net` service, like
# containers in a Kubernetes pod. So localhost:<port> reaches the same service from your
# machine, your browser and every container, and Lakekeeper can hand out http://localhost:9000
# as the storage endpoint. The Lakekeeper UI's table preview reads files from the browser at
# that address.
#
# Every setting has a default, so `docker compose up -d` works as is; .env overrides them.

name: iceberg-elt-demo

x-minio-credentials: &minio-credentials
  # also in lakekeeper/create-warehouse.json: change both together
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-root-user}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-root-password}

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-This-is-NOT-Secure!}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@lakekeeper-db:5432/postgres
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@lakekeeper-db:5432/postgres

services:
  # --- Shared network ---------------------------------------------------------
  # Holds the network namespace the other services join with `network_mode: service:net`, so
  # it publishes all their ports. Services in it can't share a port. pause does nothing but
  # wait (about 300 KB of memory). If net is recreated, `docker compose up -d` recreates the
  # services in it too.
  net:
    image: registry.k8s.io/pause:3.10.1
    ports:
      - "3000:3000"   # Dagster
      - "8080:8080"   # Trino
      - "8181:8181"   # Lakekeeper
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO console

  # --- Object storage --------------------------------------------------------
  # MinIO no longer publishes images; silo is a maintained MinIO fork (same API, same mc).
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      <<: *minio-credentials
    network_mode: service:net
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s

  create-bucket:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    network_mode: service:net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/lake
    environment:
      <<: *minio-credentials
    restart: "no"

  # --- Iceberg REST catalog: Lakekeeper ---------------------------------------
  lakekeeper-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - lakekeeper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:-v0.13.6}
    environment:
      <<: *lakekeeper-env
    command: ["migrate"]
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:-v0.13.6}
    environment:
      <<: *lakekeeper-env
      # Prometheus metrics default to port 9000, which MinIO uses in the shared network
      LAKEKEEPER__METRICS_PORT: 9100
    command: ["serve"]
    network_mode: service:net
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 3s

  # One-shot: bootstrap the server and create the "demo" warehouse on s3://lake/lakekeeper
  # (storage endpoint http://localhost:9000). A 4xx on re-run means it already exists, which is fine.
  lakekeeper-init:
    image: curlimages/curl:8.16.0
    network_mode: service:net
    depends_on:
      lakekeeper:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        curl -s -o /dev/null -w "bootstrap: %{http_code}\n" -X POST http://localhost:8181/management/v1/bootstrap \
          -H 'Content-Type: application/json' -d '{"accept-terms-of-use": true}'
        curl -s -w "\nwarehouse: %{http_code}\n" -X POST http://localhost:8181/management/v1/warehouse \
          -H 'Content-Type: application/json' -d @/init/create-warehouse.json
        exit 0
    volumes:
      - ./lakekeeper/create-warehouse.json:/init/create-warehouse.json:ro
    restart: "no"

  # --- Query engine: Trino ----------------------------------------------------
  # dbt-trino sends every model's SQL here. Trino reads and writes the Iceberg tables through
  # its `lake` catalog, the Lakekeeper warehouse "demo" (trino/catalog/lake.properties).
  # The image sizes the JVM heap at 80% of the container's memory, so mem_limit caps both.
  # Trino used about 1.9 GB running the models, too close to a 2 GB limit.
  trino:
    image: trinodb/trino:${TRINO_VERSION:-483}
    network_mode: service:net
    volumes:
      - ./trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully

  # --- Orchestration ----------------------------------------------------------
  # dagster dev with the workspace's locked environment. Project sources are bind-mounted,
  # so code edits show up after "Reload definitions" in the UI.
  dagster:
    build:
      context: ..
      dockerfile: infra/dagster/Dockerfile
    network_mode: service:net
    environment:
      # MinIO keys for dlt's filesystem destination (state and schema files next to the tables)
      DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio-root-user}
      DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-root-password}
      # dbt artifacts aren't portable between a Windows/macOS host and Linux, so the container
      # keeps its own target dir in case dbt also runs on the host (e.g. an IDE extension)
      DBT_TARGET_PATH: target-docker
    volumes:
      - ../extract_load:/app/extract_load
      - ../transform:/app/transform
      - ../orchestrate:/app/orchestrate
      - dagster-home:/opt/dagster/home
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy

volumes:
  dagster-home:
  minio-data:
  lakekeeper-db-data:
