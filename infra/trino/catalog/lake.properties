# Trino catalog `lake`: the Lakekeeper warehouse "demo". dbt uses `lake` as its database.
# Lakekeeper vends short-lived S3 credentials for each table, so no S3 keys are set here. The
# S3 settings tell Trino how to reach MinIO with them: the endpoint, region and path-style
# addressing match the warehouse's storage profile (lakekeeper/create-warehouse.json).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=demo
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
